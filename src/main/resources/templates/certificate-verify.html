<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Certificate | IT SUTRAA</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body><main class="verify-page"><div class="verify-card" th:if="${certificate != null}"><div class="verify-mark">✓</div><span class="eyebrow">IT SUTRAA VERIFICATION</span><h1>Certificate Verified</h1><p>This certificate is authentic and was issued by IT SUTRAA.</p><div class="verify-grid"><span>Certificate ID</span><b th:text="${certificate.certificateId}"></b><span>Student</span><b th:text="${certificate.student.name}"></b><span>Course</span><b th:text="${certificate.course.title}"></b><span>Score</span><b th:text="${certificate.score + ' / ' + certificate.totalQuestions}"></b><span>Issued</span><b th:text="${#temporals.format(certificate.issuedAt,'dd MMM yyyy')}"></b></div><a class="btn" th:href="@{'/certificate/download/' + ${certificate.certificateId}}">Download PDF</a></div><div class="verify-card" th:unless="${certificate != null}"><div class="verify-mark bad">!</div><h1>Certificate Not Found</h1><p>No certificate matches ID <b th:text="${certificateId}"></b>.</p><a class="btn" href="/">Go Home</a></div></main></body></html>
