<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Internships | IT SUTRAA</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body><div class="admin-wrap"><div class="admin-top"><div><span class="eyebrow">INTERNSHIP CONTROL</span><h1>Manage Internships</h1></div><div><a class="admin-btn secondary" href="/admin/dashboard">Dashboard</a> <a class="admin-btn" href="/admin/internships/new">➕ Add Internship</a></div></div><div th:if="${param.success}" class="alert success" th:text="${param.success}"></div><div class="admin-card"><div class="table-scroll"><table><thead><tr><th>Photo</th><th>Domain</th><th>Internship</th><th>Duration</th><th>Special Price</th><th>Original</th><th>Actions</th></tr></thead><tbody><tr th:each="i : ${internships}"><td><img class="admin-thumb" th:src="${i.imageUrl}" alt="Internship"></td><td th:text="${i.domain}"></td><td><b th:text="${i.title}"></b><br><small th:text="${i.description}"></small></td><td th:text="${i.duration}"></td><td><strong>₹<span th:text="${i.price}"></span></strong></td><td><s>₹<span th:text="${i.originalPrice}"></span></s></td><td class="actions"><a th:href="@{'/admin/internships/edit/' + ${i.id}}">✏️ Edit</a><a th:href="@{'/admin/internships/delete/' + ${i.id}}" onclick="return confirm('Delete this internship?')">🗑️ Delete</a></td></tr></tbody></table></div></div></div></body></html>
