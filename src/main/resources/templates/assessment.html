<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final Assessment | IT SUTRAA</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body><header class="nav"><a class="brand" href="/"><img th:src="@{/images/logo.png}"><span>IT SUTRAA</span></a><nav><a href="/profile">Dashboard</a><a href="/courses">Courses</a></nav></header><main class="quiz-page"><div class="quiz-hero"><span class="eyebrow">FINAL COURSE ASSESSMENT</span><h1 th:text="${course.title}"></h1><p>10 questions • Pass mark: <b>7/10</b> • Certificate generated automatically after passing.</p></div><form class="quiz-form" th:action="@{'/assessment/' + ${course.id} + '/submit'}" method="post"><div class="question-card" th:each="q,stat : ${questions}"><div class="q-number">Question <span th:text="${stat.count}"></span>/10</div><h3 th:text="${q.question}"></h3><label><input type="radio" th:name="${'q'+q.id}" value="A" required><span th:text="${q.optionA}"></span></label><label><input type="radio" th:name="${'q'+q.id}" value="B"><span th:text="${q.optionB}"></span></label><label><input type="radio" th:name="${'q'+q.id}" value="C"><span th:text="${q.optionC}"></span></label><label><input type="radio" th:name="${'q'+q.id}" value="D"><span th:text="${q.optionD}"></span></label></div><button class="btn quiz-submit" type="submit">Submit Assessment & Generate Result →</button></form></main></body></html>
