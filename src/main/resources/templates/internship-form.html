<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Internship Form | IT SUTRAA</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body><div class="admin-wrap"><div class="admin-top"><div><span class="eyebrow">IT SUTRAA ADMIN</span><h1 th:text="${internship.id != null ? 'Edit Internship' : 'Add Internship'}"></h1></div><a class="admin-btn secondary" href="/admin/internships">Back</a></div><div class="admin-card form-card"><form th:action="@{/admin/internships/save}" th:object="${internship}" method="post" enctype="multipart/form-data"><input type="hidden" th:field="*{id}"><div class="form-grid"><label>Domain<input th:field="*{domain}" placeholder="Java / Python / AI & ML" required></label><label>Title<input th:field="*{title}" placeholder="Java Development Internship" required></label><label>Duration<input th:field="*{duration}" placeholder="3 Months / 6 Months" required></label><label>Special Price (₹)<input type="number" min="0" th:field="*{price}" required></label><label>Original Price (₹)<input type="number" min="0" th:field="*{originalPrice}" required></label><label>Image URL<input th:field="*{imageUrl}" placeholder="/images/internship-java.svg"></label></div><label>Description<textarea th:field="*{description}" rows="6" required></textarea></label><label>Upload Photo<input type="file" name="imageFile" accept="image/png,image/jpeg,image/webp"></label><button class="admin-btn" type="submit">💾 Save Internship</button></form></div></div></body></html>
