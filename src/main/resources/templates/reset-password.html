<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset Password | IT SUTRAA</title><link rel="stylesheet" href="/css/styles.css"></head><body><div class="auth-shell"><div class="auth-card"><a href="/" class="brand">IT <span>SUTRAA</span></a><h1>Create a new password</h1><p class="auth-sub">Choose a strong password with at least 8 characters.</p><div th:if="${error}" class="alert error" th:text="${error}"></div><form action="/reset-password" method="post"><input type="hidden" name="token" th:value="${token}"><label>New Password</label><input type="password" name="password" minlength="8" required><label>Confirm Password</label><input type="password" name="confirmPassword" minlength="8" required><button class="btn-primary" type="submit">Update Password</button></form></div></div></body></html>
