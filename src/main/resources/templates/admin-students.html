<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Students | IT SUTRAA</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body><div class="admin-wrap"><div class="admin-top"><div><span class="eyebrow">STUDENT MANAGEMENT</span><h1>Registered Students</h1><p class="muted">See who joined, contact details and where they discovered IT SUTRAA.</p></div><a class="admin-btn secondary" href="/admin/dashboard">Dashboard</a></div><div class="admin-card"><div class="table-scroll"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Source</th><th>Registered</th><th>Admin</th><th>Action</th></tr></thead><tbody><tr th:each="student : ${students}"><td th:text="${student.name}"></td><td th:text="${student.email}"></td><td th:text="${student.phone}"></td><td><span class="badge" th:text="${student.registrationSource}"></span></td><td th:text="${student.registeredAt}"></td><td th:text="${student.admin ? 'YES' : 'NO'}"></td><td><a th:if="${!student.admin}" th:href="@{'/admin/students/delete/' + ${student.id}}" onclick="return confirm('Delete this student?')">🗑️ Delete</a></td></tr></tbody></table></div></div></div></body></html>
