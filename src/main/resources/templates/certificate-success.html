<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate | IT SUTRAA</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body><main class="result-page"><div class="certificate-success"><div class="confetti">🎉 🏆 🎓</div><span class="eyebrow">CERTIFICATE UNLOCKED</span><h1>Congratulations, <span th:text="${certificate.student.name}"></span>!</h1><p>You successfully completed <b th:text="${certificate.course.title}"></b>.</p><div class="cert-mini"><strong th:text="${certificate.certificateId}"></strong><span th:text="${certificate.score + '/' + certificate.totalQuestions + ' Score'}"></span></div><div class="success-actions"><a class="btn" th:href="@{'/certificate/download/' + ${certificate.certificateId}}">Download PDF Certificate ↓</a><a class="outline-btn" th:href="@{'/certificate/verify/' + ${certificate.certificateId}}">Verify Certificate</a></div><a class="back" href="/profile">Go to Student Dashboard</a></div></main></body></html>
