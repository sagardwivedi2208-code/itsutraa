<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Courses | IT SUTRAA</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head><body><div class="admin-wrap"><div class="admin-top"><div><span class="eyebrow">CATALOG CONTROL</span><h1>Manage Courses</h1></div><div><a class="admin-btn secondary" href="/admin/dashboard">Dashboard</a> <a class="admin-btn" href="/admin/courses/new">➕ Add Course</a></div></div><div th:if="${param.success}" class="alert success" th:text="${param.success}"></div><div th:if="${param.error}" class="alert error" th:text="${param.error}"></div><div class="admin-card"><div class="table-scroll"><table><thead><tr><th>Photo</th><th>Course</th><th>Special Price</th><th>Original</th><th>Description</th><th>Actions</th></tr></thead><tbody><tr th:each="course : ${courses}"><td><img class="admin-thumb" th:src="${course.imageUrl}" alt="Course"></td><td><b th:text="${course.title}"></b></td><td><strong>₹<span th:text="${course.price}"></span></strong></td><td><s>₹<span th:text="${course.originalPrice}"></span></s></td><td th:text="${course.description}"></td><td class="actions"><a th:href="@{'/admin/courses/edit/' + ${course.id}}">✏️ Edit</a><a th:href="@{'/admin/courses/delete/' + ${course.id}}" onclick="return confirm('Delete this course? This is allowed only when no student/payment is linked.')">🗑️ Delete</a></td></tr></tbody></table></div></div></div></body></html>
