<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Forgot Password | IT SUTRAA</title><link rel="stylesheet" href="/css/styles.css"></head><body><div class="auth-shell"><div class="auth-card"><a href="/" class="brand">IT <span>SUTRAA</span></a><h1>Forgot your password?</h1><p class="auth-sub">Enter your registered email and we'll send you a secure password reset link.</p><div th:if="${message}" class="alert success" th:text="${message}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div><form action="/forgot-password" method="post"><label>Email Address</label><input type="email" name="email" placeholder="you@example.com" required><button class="btn-primary" type="submit">Send Reset Link</button></form><p class="auth-foot"><a href="/login">← Back to Login</a></p></div></div></body></html>
